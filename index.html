<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakistan Sales Tracker | Premium Deals</title>
    <meta name="description" content="Track the latest sales and discounts from top Pakistani brands including Khaadi, Sapphire, J., Ideas, and more. Never miss a deal again!">
    <meta name="keywords" content="Pakistan Sales, Brand Discounts, Khaadi Sale, Sapphire Sale, Ideas Sale, Online Shopping Pakistan">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #16a34a;
            --accent: #e11d48;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text: #0f172a;
            --text-muted: #64748b;
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.08) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(225, 29, 72, 0.08) 0, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            color: #000;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Search & Filters */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .search-box {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            border-radius: 16px;
            color: var(--text);
            width: 100%;
            max-width: 600px;
            backdrop-filter: blur(10px);
            outline: none;
            transition: all 0.3s;
            font-size: 1.1rem;
            text-align: center;
        }

        .filter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .filter-label {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
        }

        .brand-filters {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 0.6rem 1.2rem;
            border-radius: 100px;
            color: var(--text);
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border: 1px dashed var(--glass-border);
            border-radius: 24px;
            margin-top: 2rem;
        }

        .empty-state h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        /* Grid */
        .sales-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Card */
        .sale-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 0.6s ease-out both;
        }

        .sale-card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 0, 0, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .img-container {
            width: 100%;
            height: 350px;
            overflow: hidden;
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s;
        }

        .sale-card:hover .product-img {
            transform: scale(1.1);
        }

        .brand-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            font-weight: 700;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .discount-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--accent);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 10;
        }

        .card-content {
            padding: 1.5rem;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.5;
            height: 3.3rem;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .sale-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
        }

        .original-price {
            font-size: 1rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .buy-btn:hover {
            background: #15803d;
            filter: brightness(1.1);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading */
        #loader {
            text-align: center;
            padding: 5rem;
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            body {
                padding: 1rem;
            }
            
            .filter-btn {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
            
            .product-title {
                font-size: 1rem;
                height: 3rem;
            }
            
            .img-container {
                height: 280px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Sale <span style="color: var(--primary);">Shale</span></h1>
            <p class="subtitle" style="font-size: 1.2rem; font-weight: 600; color: #000; letter-spacing: normal;">Never Miss A Sale.</p>
        </header>

        <div class="search-container">
            <input type="text" id="search" class="search-box" placeholder="Search products or brands...">
        </div>

        <div class="filter-container">
            <span class="filter-label">Explore Brands:</span>
            <div class="brand-filters" id="brand-filters">
                <button class="filter-btn active" data-brand="all">All Brands</button>
                <button class="filter-btn" data-brand="Alkaram Studio">Alkaram</button>
                <button class="filter-btn" data-brand="Bareeze">Bareeze</button>
                <button class="filter-btn" data-brand="Bata">Bata</button>
                <button class="filter-btn" data-brand="Bonanza Satrangi">Bonanza</button>
                <button class="filter-btn" data-brand="Borjan">Borjan</button>
                <button class="filter-btn" data-brand="Charcoal">Charcoal</button>
                <button class="filter-btn" data-brand="Cougar">Cougar</button>
                <div id="hidden-brands" style="display: none;">
                    <button class="filter-btn" data-brand="Diners">Diners</button>
                    <button class="filter-btn" data-brand="ECS">ECS</button>
                    <button class="filter-btn" data-brand="Edenrobe">Edenrobe</button>
                    <button class="filter-btn" data-brand="Engine">Engine</button>
                    <button class="filter-btn" data-brand="Ethnic">Ethnic</button>
                    <button class="filter-btn" data-brand="Hush Puppies">Hush Puppies</button>
                    <button class="filter-btn" data-brand="Gul Ahmed / Ideas">Ideas</button>
                    <button class="filter-btn" data-brand="J.">J.</button>
                    <button class="filter-btn" data-brand="Khaadi">Khaadi</button>
                    <button class="filter-btn" data-brand="Limelight">Limelight</button>
                    <button class="filter-btn" data-brand="Maria B.">Maria B.</button>
                    <button class="filter-btn" data-brand="Metro Shoes">Metro</button>
                    <button class="filter-btn" data-brand="Ndure">Ndure</button>
                    <button class="filter-btn" data-brand="Nishat Linen">Nishat</button>
                    <button class="filter-btn" data-brand="ONE">ONE</button>
                    <button class="filter-btn" data-brand="Outfitters">Outfitters</button>
                    <button class="filter-btn" data-brand="Sana Safinaz">Sana Safinaz</button>
                    <button class="filter-btn" data-brand="Sapphire">Sapphire</button>
                    <button class="filter-btn" data-brand="Servis">Servis</button>
                    <button class="filter-btn" data-brand="Stylo">Stylo</button>
                    <button class="filter-btn" data-brand="Uniworth">Uniworth</button>
                    <button class="filter-btn" data-brand="Unze London">Unze London</button>
                    <button class="filter-btn" data-brand="Zellbury">Zellbury</button>
                    <button class="filter-btn" data-brand="Agha Noor">Agha Noor</button>
                    <button class="filter-btn" data-brand="Almirah">Almirah</button>
                    <button class="filter-btn" data-brand="Beechtree">Beechtree</button>
                    <button class="filter-btn" data-brand="Breakout">Breakout</button>
                    <button class="filter-btn" data-brand="Chen One">Chen One</button>
                    <button class="filter-btn" data-brand="Clive">Clive</button>
                    <button class="filter-btn" data-brand="Furor">Furor</button>
                    <button class="filter-btn" data-brand="Generation">Generation</button>
                    <button class="filter-btn" data-brand="Insignia">Insignia</button>
                    <button class="filter-btn" data-brand="Jolly">Jolly</button>
                    <button class="filter-btn" data-brand="Lama">Lama</button>
                    <button class="filter-btn" data-brand="Moicciani">Moicciani</button>
                    <button class="filter-btn" data-brand="Rangja">Rangja</button>
                    <button class="filter-btn" data-brand="Shaposh">Shaposh</button>
                    <button class="filter-btn" data-brand="Taana Baana">Taana Baana</button>
                </div>
                <button type="button" class="filter-btn" id="more-brands-btn" style="background-color: rgba(0,0,0,0.05); font-weight: bold; color: var(--text);">Show More Brands</button>
            </div>
        </div>



        <div id="loader">Discovering the best deals for you...</div>
        <div class="sales-grid" id="grid"></div>
        <div id="load-more-container" style="text-align: center; margin-top: 2rem; display: none;">
            <button id="load-more-btn" class="filter-btn" style="background: var(--primary); color: white; padding: 0.8rem 2rem; font-size: 1.1rem; border: none; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);">Load More</button>
        </div>
    </div>

    <script src="data.js"
        onerror="this.onerror=null; document.getElementById('loader').innerHTML='Data Not Found<br>The data.js file could not be loaded.<br><br>Please run python scraper/main.py first to generate the deals.';"></script>
    <script>
        let allProducts = window.salesData || [];
        let currentlyDisplayedProducts = [];
        let displayLimit = 20;
        const grid = document.getElementById('grid');
        const loader = document.getElementById('loader');
        const searchInput = document.getElementById('search');
        const brandBtns = document.querySelectorAll('#brand-filters .filter-btn');
        const loadMoreContainer = document.getElementById('load-more-container');
        const loadMoreBtn = document.getElementById('load-more-btn');


        async function init() {
            try {
                if (!window.salesData) {
                    throw new Error("data.js not loaded properly");
                }

                // Sort by date (newest first)
                allProducts.sort((a, b) => new Date(b.scraped_at) - new Date(a.scraped_at));

                loader.style.display = 'none';
                currentlyDisplayedProducts = [...allProducts];
                displayCurrentItems();
            } catch (error) {
                // If window.salesData is missing, the onerror on script tag handles it usually
                console.error(error);
            }
        }

        function calculateDiscount(original, sale) {
            try {
                // If inputs are already numbers (Bareeze fix)
                const o = typeof original === 'number' ? original : parseFloat(String(original).replace(/\D/g, ''));
                const s = typeof sale === 'number' ? sale : parseFloat(String(sale).replace(/\D/g, ''));
                if (o > 0 && s > 0 && o > s) {
                    return Math.round(((o - s) / o) * 100);
                }
            } catch (e) { }
            return 0;
        }

        function render(products, append = false) {
            if (products.length === 0 && !append) {
                grid.innerHTML = `
                    <div class="no-results" style="grid-column: 1/-1; text-align: center; margin-top: 2rem;">
                        <i class="fas fa-search"></i>
                        <p>No current sales found for this category.</p>
                    </div>
                `;
                if(loadMoreContainer) loadMoreContainer.style.display = 'none';
                return;
            }
            const html = products.map((p, index) => `
                <div class="sale-card" style="animation-delay: ${(index % 20) * 0.05}s">
                    <div class="img-container">
                        <img src="${p.image_url}" class="product-img" loading="lazy" onerror="this.src='https://via.placeholder.com/400x600?text=No+Image'">
                        <span class="brand-badge">${p.brand}</span>
                        <span class="discount-badge">${p.discount_percentage || calculateDiscount(p.original_price, p.sale_price)}% OFF</span>
                    </div>
                    <div class="card-content">
                        <h3 class="product-title">${p.title}</h3>
                        <div class="price-row">
                            <span class="sale-price">${p.sale_price}</span>
                            ${p.original_price !== "N/A" ? `<span class="original-price">${p.original_price}</span>` : ''}
                        </div>
                        <a href="${p.url}" target="_blank" class="buy-btn">View on Brand Site</a>
                    </div>
                </div>
            `).join('');

            if (append) {
                grid.insertAdjacentHTML('beforeend', html);
            } else {
                grid.innerHTML = html;
            }
        }

        function displayCurrentItems() {
            const itemsToRender = currentlyDisplayedProducts.slice(0, displayLimit);
            render(itemsToRender);
            
            if (displayLimit < currentlyDisplayedProducts.length) {
                if(loadMoreContainer) loadMoreContainer.style.display = 'block';
            } else {
                if(loadMoreContainer) loadMoreContainer.style.display = 'none';
            }
        }

        // Filtering & Search
        function applyFilters() {
            displayLimit = 20; // reset limit
            const searchTerm = searchInput.value.toLowerCase();
            const activeBrandBtn = document.querySelector('#brand-filters .filter-btn.active');

            const activeBrand = activeBrandBtn ? activeBrandBtn.dataset.brand : 'all';

            currentlyDisplayedProducts = allProducts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchTerm) ||
                    p.brand.toLowerCase().includes(searchTerm);
                const matchesBrand = activeBrand === 'all' || p.brand === activeBrand;

                return matchesSearch && matchesBrand;
            });
            displayCurrentItems();
        }

        searchInput.addEventListener('input', applyFilters);

        brandBtns.forEach(btn => {
            if (btn.id === 'more-brands-btn') return;
            btn.addEventListener('click', () => {
                brandBtns.forEach(b => {
                    if (b.id !== 'more-brands-btn') b.classList.remove('active');
                });
                btn.classList.add('active');
                applyFilters();
            });
        });

        const moreBrandsBtn = document.getElementById('more-brands-btn');
        const hiddenBrands = document.getElementById('hidden-brands');
        if (moreBrandsBtn && hiddenBrands) {
            moreBrandsBtn.addEventListener('click', () => {
                hiddenBrands.style.display = 'contents';
                moreBrandsBtn.style.display = 'none';
            });
        }

        if (loadMoreBtn) {
            loadMoreBtn.addEventListener('click', () => {
                const prevLimit = displayLimit;
                displayLimit += 20;
                const newItems = currentlyDisplayedProducts.slice(prevLimit, displayLimit);
                render(newItems, true);
                if (displayLimit >= currentlyDisplayedProducts.length) {
                    loadMoreContainer.style.display = 'none';
                }
            });
        }

        // Initialize
        if (window.salesData) {
            init();
        } else {
            // Wait for script to load via standard onload if needed
            window.onload = init;
        }
    </script>
</body>

</html>
